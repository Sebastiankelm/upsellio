name: Production release (Upsellio)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upsellio-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision without submodules
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --no-tags --no-recurse-submodules origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach "$GITHUB_SHA"
          unset auth TOKEN
      - name: Validate deployment tooling and callback contract
        run: |
          set -eu
          python3 -m py_compile tools/deploy/build-release.py
          php -n -l tools/deploy/apply-release.php
          php -n tests/mobile-callback-contract.php
          php -n tests/seo-indexability-contract.php
          php -n tests/public-editorial-contract.php /tmp/upsellio-public-editorial.js
          php -n tests/blog-reading-contract.php
          node --check /tmp/upsellio-public-editorial.js
          bash tests/production-deploy-contract.sh
      - name: Lint public theme
        run: |
          set -eu
          for file in front-page.php functions.php header.php home.php single.php single-miasto.php single-definicja.php inc/crm.php inc/form-component.php inc/technical-seo.php inc/seo-indexing-fixes.php inc/cities-seed.php inc/definitions-seed.php page-kontakt.php page-marketing-google-ads.php page-marketing-meta-ads.php page-tworzenie-stron-internetowych.php; do
            php -n -l "wp-content/themes/upsellio/$file"
          done
          node --check wp-content/themes/upsellio/assets/js/upsellio.js
          node --check wp-content/themes/upsellio/assets/js/upsellio-ui.js
  # Production defaults to the WordPress DevOps Bridge manifest protocol.
  # Legacy SSH is an explicit manual fallback only, never an automatic push job.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && vars.UPSELLIO_ENABLE_LEGACY_SSH == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout exact revision without submodules
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --no-tags --no-recurse-submodules origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach "$GITHUB_SHA"
          unset auth TOKEN
      - name: Configure authenticated SSH
        env:
          SSH_HOST: ${{ secrets.UPSELLIO_SSH_HOST }}
          SSH_USER: ${{ secrets.UPSELLIO_SSH_USER }}
          SSH_KEY: ${{ secrets.UPSELLIO_SSH_PRIVATE_KEY }}
          SSH_HOST_KEYS: ${{ secrets.UPSELLIO_SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.UPSELLIO_SSH_PORT || '22' }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$SSH_HOST_KEYS" || { echo "::error::Production SSH secrets are missing. See docs/production-cicd.md."; exit 1; }
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]] && [[ "$SSH_USER" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]*$ ]] && [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]] || exit 1
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/upsellio_deploy"
          printf '%s\n' "$SSH_HOST_KEYS" > "$HOME/.ssh/upsellio_known_hosts"
          printf 'Host upsellio-prod\n HostName %s\n User %s\n Port %s\n IdentityFile ~/.ssh/upsellio_deploy\n UserKnownHostsFile ~/.ssh/upsellio_known_hosts\n StrictHostKeyChecking yes\n BatchMode yes\n IdentitiesOnly yes\n ConnectTimeout 15\n' "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > "$HOME/.ssh/config"
      - name: Prepare and publish guarded release
        run: |
          set -eu
          ssh upsellio-prod 'umask 077; mkdir -p "$HOME/.upsellio-deploy/incoming"; test ! -e "$HOME/.upsellio-deploy/pending.json"'
          BASE=$(ssh upsellio-prod 'if test -f "$HOME/.upsellio-deploy/deployed-sha"; then cat "$HOME/.upsellio-deploy/deployed-sha"; else printf "%s\n" d8b359ae80d1f8021cbe904e0bf43fa6115ac056; fi')
          python3 tools/deploy/build-release.py "$BASE" "$GITHUB_SHA" release-bundle
          cp tools/deploy/apply-release.php release-bundle/
          RELEASE_ID="run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh upsellio-prod "umask 077; mkdir .upsellio-deploy/incoming/$RELEASE_ID"
          scp -r release-bundle/. "upsellio-prod:.upsellio-deploy/incoming/$RELEASE_ID/"
          ssh upsellio-prod "php .upsellio-deploy/incoming/$RELEASE_ID/apply-release.php .upsellio-deploy/incoming/$RELEASE_ID check"
          ssh upsellio-prod "php .upsellio-deploy/incoming/$RELEASE_ID/apply-release.php .upsellio-deploy/incoming/$RELEASE_ID apply"
      - name: Remove temporary local credentials
        if: always()
        run: rm -f "$HOME/.ssh/upsellio_deploy" "$HOME/.ssh/upsellio_known_hosts" "$HOME/.ssh/config"
