name: Presentation release validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate and exact PR base without submodules
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --depth=1 --no-tags --no-recurse-submodules origin "$GITHUB_SHA" "$BASE_SHA"
          git -c submodule.recurse=false checkout --detach "$GITHUB_SHA"
          unset auth CHECKOUT_TOKEN
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA"
      - name: PHP lint and preservation of presentation contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          php -v
          python3 - <<'PY'
          import os, re, subprocess, pathlib, collections
          p = pathlib.Path("wp-content/themes/upsellio")
          names = ["front-page.php","home.php","page-kontakt.php","page-marketing-google-ads.php","page-marketing-meta-ads.php","page-tworzenie-stron-internetowych.php","single.php"]
          for n in names:
              f=p/n
              subprocess.run(["php","-n","-l",str(f)],check=True)
              old=subprocess.check_output(["git","show",os.environ["BASE_SHA"]+":"+str(f)]).decode("utf-8").replace("\r\n","\n")
              new=f.read_text(encoding="utf-8")
              a,sep,b=old.partition("get_header();")
              c,sep2,d=new.partition("get_header();")
              assert sep and sep2 and a==c,(n,"head changed")
              assert len(re.findall(r"<h1\b",d))==1,(n,"H1")
              ids=lambda s:collections.Counter(re.findall(r'\bid="([A-Za-z][\w-]*)"',s))
              orig,cur=ids(b),ids(d)
              assert orig.keys()<=cur.keys(),(n,"missing IDs",orig.keys()-cur.keys())
              assert all(v<=max(1,orig[k]) for k,v in cur.items()),(n,"duplicate IDs")
              links=lambda s:set(re.findall(r'href="#[A-Za-z][\w-]*"',s))
              assert links(b)<=links(d),(n,"lost anchors")
              origins=lambda s:re.findall(r'"origin"\s*=>\s*"[^"]+"',s)
              assert origins(old)==origins(new),(n,"form origins changed")
              print(n,"PASS: lint, head, H1, IDs, anchors, origins")
          PY
      - name: Shared JavaScript syntax
        run: |
          node --check wp-content/themes/upsellio/assets/js/upsellio-ui.js
          node --check wp-content/themes/upsellio/assets/js/upsellio.js
