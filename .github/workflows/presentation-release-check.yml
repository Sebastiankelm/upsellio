name: Presentation release validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate and exact PR base without submodules
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --depth=1 --no-tags --no-recurse-submodules origin "$GITHUB_SHA" "$BASE_SHA"
          git -c submodule.recurse=false checkout --detach "$GITHUB_SHA"
          unset auth CHECKOUT_TOKEN
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA"
      - name: PHP lint and preservation of presentation contracts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          php -v
          python3 - <<'PY'
          import os, re, subprocess, pathlib, collections
          p = pathlib.Path("wp-content/themes/upsellio")
          names = ["front-page.php","home.php","page-kontakt.php","page-marketing-google-ads.php","page-marketing-meta-ads.php","page-tworzenie-stron-internetowych.php","single.php"]
          for n in names:
              f=p/n
              subprocess.run(["php","-n","-l",str(f)],check=True)
              old=subprocess.check_output(["git","show",os.environ["BASE_SHA"]+":"+str(f)]).decode("utf-8").replace("\r\n","\n")
              new=f.read_text(encoding="utf-8")
              if n=="home.php" and "Upsellio - Blog (Reference)" in new:
                  wrapper=(p/"ups-blog-core.php").read_text(encoding="utf-8")
                  subprocess.run(["php","-n","-l",str(p/"ups-blog-core.php")],check=True)
                  assert "require get_theme_file_path('/home.php');" in wrapper
                  assert "require get_theme_file_path('/ups-blog-core.php');" not in new
                  for marker in ("get_header();","get_footer();","upsellio_get_blog_payload","blog_search","ub-tag-filter","max_num_pages","'@type'=>'Blog'","upsellio_get_primary_lead_magnet"):
                      assert marker in new,(n,"missing blog contract",marker)
                  assert len(re.findall(r"<h1\b",new))==1
                  assert len(re.findall(r"<form\b",new))==1
                  print(n,"PASS: self-contained selectable blog, query, filters, pagination and schema")
                  continue
              a,sep,b=old.partition("get_header();")
              c,sep2,d=new.partition("get_header();")
              # Intentional reference-design migration: the homepage has a new contract.
              # Other templates retain all previous presentation safeguards.
              if n=="front-page.php" and "upsellio-reference-home-css" in new:
                  assert sep2 and "get_footer(null," in new
                  header=(p/"header.php").read_text(encoding="utf-8")
                  footer=(p/"footer.php").read_text(encoding="utf-8")
                  for shared in ("header.php","footer.php"):
                      subprocess.run(["php","-n","-l",str(p/shared)],check=True)
                  assert "wp_head();" in header and "wp_footer();" in footer
                  assert "function upsellio_render_reference_cta(" in footer
                  assert "function upsellio_render_reference_footer(" in footer
                  assert "upsellio_render_reference_footer();" in footer
                  assert "reference_cta" in d
                  assert "upsellio_reference_home_nav()" not in new
                  assert len(re.findall(r"<h1\b",d))==1
                  assert len(re.findall(r"<form\b",d))==1
                  assert len(re.findall(r"<section\b",d))==8 # ninth section is the shared CTA
                  for key in ("start","diagnoza","kontakt","problem","uslugi","system","case-study","kim-jestem","jak-dzialam","faq","up-ref-main"):
                      assert 'id="'+key+'"' in d,(n,"missing reference ID",key)
                  for name in ("lead_name","lead_phone","lead_company","lead_consent","lead_form_origin"):
                      assert 'name="'+name+'"' in d,(n,"missing CRM field",name)
                  assert 'value="home-hero-form"' in d and 'value="upsellio_submit_lead"' in d
                  assert "upsellio_unified_lead_form" in d
                  assert "Więcej zamówień" in d and "Trzy proste kroki" in d
                  assert "dc-import" not in d and ".dc.html" not in d
                  assert all(marker in header for marker in ('id="upref-nav"', 'id="ur-services"', 'id="ur-mobile-toggle"', 'aria-expanded', 'Escape'))
                  assert 'nf-footer' in footer and '$normalized_city_links' in footer
                  assert "prefers-reduced-motion" in new
                  print(n,"PASS: reference layout, single short CRM form, navigation and anchors")
                  continue
              assert sep and sep2 and a==c,(n,"head changed")
              if n.startswith("page-marketing-") or n=="page-tworzenie-stron-internetowych.php":
                  assert "reference_cta" in d and "FAQPage" in d
              if n=="single.php":
                  assert "upsellio_render_lead_form(" in d and "upsellio_prepare_toc_content" in new
              if n=="page-kontakt.php":
                  assert "upsellio_unified_lead_form" in d and "upsellio_submit_lead" in d
              assert len(re.findall(r"<h1\b",d))==1,(n,"H1")
              ids=lambda s:collections.Counter(re.findall(r'\bid="([A-Za-z][\w-]*)"',s))
              orig,cur=ids(b),ids(d)
              assert orig.keys()<=cur.keys(),(n,"missing IDs",orig.keys()-cur.keys())
              assert all(v<=max(1,orig[k]) for k,v in cur.items()),(n,"duplicate IDs")
              links=lambda s:set(re.findall(r'href="#[A-Za-z][\w-]*"',s))
              assert links(b)<=links(d),(n,"lost anchors")
              origins=lambda s:re.findall(r'"origin"\s*=>\s*"[^"]+"',s)
              assert origins(old)==origins(new),(n,"form origins changed")
              if n in ("front-page.php","page-marketing-google-ads.php","page-marketing-meta-ads.php","page-tworzenie-stron-internetowych.php") and 'class="up-extra-content"' in d:
                  assert d.count('class="up-extra-content"')==1,(n,"one additional content disclosure")
                  start=d.index('<details class="up-extra-content">')
                  stop=d.index('</div></details>',start)
                  assert stop<d.index('id="faq"',stop),(n,"FAQ stays outside disclosure")
                  assert 'up-hero-mobile' in d and 'up-hero-desktop' in d,(n,"responsive hero CTA")
                  ext=d[start:stop]
                  assert len(re.findall(r'<section\b',ext))==len(re.findall(r'</section>',ext)),(n,"balanced extended sections")
                  print(n,"PASS: optional sections, FAQ and responsive CTA")
              print(n,"PASS: lint, head, H1, IDs, anchors, origins")
          about=p/"page-o-mnie.php"
          subprocess.run(["php","-n","-l",str(about)],check=True)
          previous=subprocess.check_output(["git","show",os.environ["BASE_SHA"]+":"+str(about)]).decode("utf-8").replace("\r\n","\n")
          current=about.read_text(encoding="utf-8")
          seo=lambda s:s[s.index('add_action("wp_head"'):s.index("get_header();")]
          assert seo(previous)==seo(current),"About Person and breadcrumb schema changed"
          assert 'upsellio_register_template_seo_head("about")' in current
          assert len(re.findall(r"<h1\b",current))==1
          assert len(re.findall(r"<section\b",current))==len(re.findall(r"</section>",current))==6
          assert current.count('id="kontakt-o-mnie"')==1 and 'href="#kontakt-o-mnie"' in current
          assert 'upsellio_render_lead_form([' in current and '"origin" => "about-contact-form"' in current
          assert '"redirect_url" => $about_url . "#kontakt-o-mnie"' in current
          assert '"variant" => "full"' in current and 'get_footer();' in current
          assert all(token in current for token in ('#effaf7','#f5f6f8','#06745f','#0f1115','prefers-reduced-motion'))
          assert "—" not in current
          print("page-o-mnie.php PASS: lint, SEO, CRM, reference palette and contact anchors")
          PY
      - name: Shared JavaScript syntax
        run: |
          node --check wp-content/themes/upsellio/assets/js/upsellio-ui.js
          node --check wp-content/themes/upsellio/assets/js/upsellio.js
