name: Offer pinned production release package
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/offer-experience-v2]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build allowlisted package from immutable release and base commits
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, shutil, subprocess
          base = "cfe6ef80746a0f8a51277b45cdebebf49045430f"
          release = "d9c0f75234c3051ddf73d68b127b533c688ab370"
          prior = "5e7e74de0a671c73d84825f9aca976740902c3ef"
          files = ["inc/anthropic-offer-ai.php", "inc/crm-app/actions.php", "inc/crm-app/render.php", "inc/followups.php", "inc/offer-landing.php", "inc/offers.php", "inc/sales-engine.php"]
          prefix = "wp-content/themes/upsellio/"
          production_hashes = {
              "inc/anthropic-offer-ai.php": "28f142b8ade90e77ee96b2229cee043040976d60bb783603b2e666049f4a617c",
              "inc/crm-app/actions.php": "a72c1db065dac9f2ae4f6e8947eba082dde267c3725121cb6bcb23c4cf0d9bc7",
              "inc/crm-app/render.php": "33fa81377d6ac93391cce1727b48962b1a7b70ae44eb62630a3dbce8b89fbe5c",
              "inc/followups.php": "a34c5ab4d0bfd77f6781029710d194b8dd0178510e7a1368788bd864f03751d5",
              "inc/offer-landing.php": "a9b3503b0e7790f50b3fa6e9edc3a0dafc2b23ab9bc5935c82c0023bf875635a",
              "inc/offers.php": "3be559bfcf96b7d345625d88fe4454bbee371ddb0f8c36b220c18351a3eb3cd0",
              "inc/sales-engine.php": "0aaa1d58e63462c8ca4a98cedb029c75dc795a1c328814fbc868fb1a6236ff8c",
          }
          package = pathlib.Path("release-package/upsellio-offer-release")
          package.mkdir(parents=True, exist_ok=False)
          (package/"payload").mkdir()
          shutil.copyfile("tools/offer-release/upsellio-offer-release.php",package/"upsellio-offer-release.php")
          manifest = {"base":base,"release":release,"prior":prior,"files":{}}
          for i, rel in enumerate(files):
              manifest["files"][rel] = {}
              for label, revision in (("old",base),("prior",prior),("new",release)):
                  data = subprocess.check_output(["git","show",f"{revision}:{prefix}{rel}"])
                  if label == "old":
                      data = data.replace(b"\r\n", b"\n").replace(b"\n", b"\r\n")
                      if hashlib.sha256(data).hexdigest() != production_hashes[rel]:
                          raise RuntimeError("Production baseline differs: " + rel)
                      print("Verified exact production baseline:", rel)
                  # Preserve release bytes unchanged (the integration-tested Git blob).
                  tmp = pathlib.Path("/tmp/offer-release-lint.php")
                  tmp.write_bytes(data)
                  subprocess.run(["php","-l",str(tmp)],check=True)
                  name = f"{i}-{label}.php"
                  (package/"payload"/name).write_bytes(b"<?php exit; __halt_compiler();" + base64.b64encode(data))
                  manifest["files"][rel][label] = {"file":name,"sha256":hashlib.sha256(data).hexdigest()}
          encoded = base64.b64encode(json.dumps(manifest,separators=(",",":")).encode()).decode()
          (package/"manifest.php").write_text("<?php if (!defined('ABSPATH')) { exit; } return json_decode(base64_decode('"+encoded+"'), true);\n")
          for f in package.rglob("*.php"):
              subprocess.run(["php","-l",str(f)],check=True)
          PY
      - name: Test exact file update, idempotence, rollback and mismatch refusal
        run: |
          cat > /tmp/test-offer-release.php <<'PHP'
          <?php
          $root = sys_get_temp_dir().'/ups-release-test-'.bin2hex(random_bytes(8));
          mkdir($root.'/theme',0755,true);
          define('ABSPATH',$root.'/');
          define('PACKAGE',getcwd().'/release-package/upsellio-offer-release/');
          function current_user_can($cap){return true;}
          function wp_is_file_mod_allowed($context){return true;}
          function is_multisite(){return false;}
          function home_url(){return 'https://upsellio.pl';}
          function get_template(){return 'upsellio';}
          function get_template_directory(){return ABSPATH.'theme';}
          function get_posts($args){return [];}
          function register_activation_hook(...$args){}
          function add_action(...$args){}
          $options = [];
          function update_option($key,$value,$autoload=false){$GLOBALS['options'][$key]=$value;return true;}
          function get_option($key,$default=false){return $GLOBALS['options'][$key]??$default;}
          class MockDB { public $prefix='ci_'; public $posts='ci_posts'; public $last_error=''; public function prepare($sql,...$args){return $sql;} public function get_var($q){return '1';} public function get_col($q){return ['42','43','81'];} }
          $wpdb = new MockDB();
          require PACKAGE.'upsellio-offer-release.php';
          $m=require PACKAGE.'manifest.php';
          function bytes($entry){return base64_decode(substr(file_get_contents(PACKAGE.'payload/'.$entry['file']),strlen('<?php exit; __halt_compiler();')),true);}
          function check($ok,$msg){if(!$ok){throw new RuntimeException($msg);}echo "PASS: $msg\n";}
          foreach($m['files'] as $rel=>$row){
              $p=get_template_directory().'/'.$rel;
              if(!is_dir(dirname($p)))mkdir(dirname($p),0755,true);
              file_put_contents($p,bytes($row['old']));
          }
          check(Upsellio_Offer_Release_200::apply()==='deployed','Pinned update completed');
          check(get_option('upsellio_offer_legacy_payload_ids_v2')===[42=>true,43=>true,81=>true],'Existing IDs recorded without modifying offer metadata');
          foreach($m['files'] as $rel=>$row)check(hash_file('sha256',get_template_directory().'/'.$rel)===$row['new']['sha256'],'New hash: '.$rel);
          check(!file_exists(ABSPATH.'.maintenance'),'Maintenance removed');
          check(Upsellio_Offer_Release_200::apply()==='already_deployed','Repeated activation is idempotent');
          check(Upsellio_Offer_Release_200::apply(true)==='rolled_back','Rollback completed');
          foreach($m['files'] as $rel=>$row)check(hash_file('sha256',get_template_directory().'/'.$rel)===$row['old']['sha256'],'Restored hash: '.$rel);
          foreach($m['files'] as $rel=>$row){file_put_contents(get_template_directory().'/'.$rel,bytes($row['prior']));}
          update_option('upsellio_offer_legacy_payload_ids_v2',[42=>true],false);
          check(Upsellio_Offer_Release_200::apply()==='deployed','Incremental patch from 2.0.3 completed');
          check(get_option('upsellio_offer_legacy_payload_ids_v2')===[42=>true],'Incremental patch preserves prior compatibility list');
          foreach($m['files'] as $rel=>$row)check(hash_file('sha256',get_template_directory().'/'.$rel)===$row['new']['sha256'],'Incremental release hash: '.$rel);
          check(Upsellio_Offer_Release_200::apply(true)==='rolled_back','Original baseline rollback after incremental patch');
          $renderer=bytes($m['files']['inc/crm-app/render.php']['new']);
          check(str_contains($renderer,'if ($view !== "offer_analytics") {'),'Offer analytics exempt from legacy redirect and allowed-view fallback');
          check(str_contains($renderer,'!current_user_can("edit_post", $oa_offer_id)'),'Offer analytics record authorization remains');
          $first=array_key_first($m['files']);$p=get_template_directory().'/'.$first;file_put_contents($p,'mismatch');
          $refused=false;
          try{Upsellio_Offer_Release_200::apply();}catch(RuntimeException $e){$refused=str_contains($e->getMessage(),'Niezgodność pliku');}
          check($refused && file_get_contents($p)==='mismatch','Refuses production drift without overwriting');
          check(!file_exists(ABSPATH.'.maintenance'),'No maintenance left after refusal');
          Upsellio_Offer_Release_200::activate();
          check(file_get_contents($p)==='mismatch','Activation does not modify production drift');
          $inspect=new ReflectionMethod(Upsellio_Offer_Release_200::class,'inspect');
          $summary=$inspect->invoke(null,false);
          $report=$inspect->invoke(null,true);
          check(count($summary)===7 && $summary[$first]['state']==='mismatch','All seven allowlisted paths inspected');
          check(!isset($summary[$first]['source_base64']),'Status summary does not include source');
          check(base64_decode($report[$first]['source_base64'],true)==='mismatch','Authenticated diagnostic export contains exact changed bytes');
          foreach($report as $rel=>$item)if($rel!==$first)check(!isset($item['source_base64']),'Unchanged source omitted: '.$rel);
          PHP
          php /tmp/test-offer-release.php
      - uses: actions/upload-artifact@v4
        with:
          name: upsellio-offer-release-2.0.4
          path: release-package/
          retention-days: 7
          if-no-files-found: error
