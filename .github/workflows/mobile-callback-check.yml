name: Mobile callback validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'wp-content/themes/upsellio/inc/crm.php'
      - 'wp-content/themes/upsellio/inc/form-component.php'
      - 'wp-content/themes/upsellio/assets/js/upsellio.js'
      - 'wp-content/themes/upsellio/assets/js/upsellio-ui.js'
      - 'tests/mobile-callback-contract.php'
      - '.github/workflows/mobile-callback-check.yml'
permissions:
  contents: read
jobs:
  callback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate without submodules
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
        run: |
          set -eu
          git init -q
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "$CHECKOUT_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.extraHeader=Authorization: Basic $auth" fetch --depth=1 --no-tags --no-recurse-submodules origin "$GITHUB_SHA"
          git -c submodule.recurse=false checkout --detach "$GITHUB_SHA"
          unset auth CHECKOUT_TOKEN
      - name: Lint and isolated contract checks
        run: |
          php -n -l wp-content/themes/upsellio/inc/crm.php
          php -n -l wp-content/themes/upsellio/inc/form-component.php
          php -n -l tests/mobile-callback-contract.php
          php -n tests/mobile-callback-contract.php
          node --check wp-content/themes/upsellio/assets/js/upsellio-ui.js
          node --check wp-content/themes/upsellio/assets/js/upsellio.js
