name: CRM PHP syntax checks

on:
  pull_request:
    paths:
      - 'wp-content/themes/upsellio/**/*.php'
      - '.github/workflows/crm-php-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check PHP syntax
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          php --version
          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only --diff-filter=ACMR -z "$BASE_SHA" HEAD -- 'wp-content/themes/upsellio/*.php' |
              xargs -0 -r -n 1 php -l
          else
            git ls-files -z 'wp-content/themes/upsellio/*.php' |
              xargs -0 -r -n 1 php -l
          fi
